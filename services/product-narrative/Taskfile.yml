version: "3"

vars:
  PKG: "@tst-autonomous/product-narrative"

tasks:
  build:
    desc: Compile this package via TypeScript project references
    cmds:
      - pnpm exec tsc -b .

  test:
    desc: Run this package's own tests (no-op if it has none)
    deps: [build]
    cmds:
      - sh -c 'ls dist/**/*.test.js >/dev/null 2>&1 && node --test dist/**/*.test.js || echo "no tests in {{.PKG}}"'

  docker:build:
    desc: Build a standalone image for just this package via turbo prune
    deps: [build]
    cmds:
      - pnpm exec turbo prune {{.PKG}} --docker --out-dir=.turbo-prune/product-narrative
      - docker build -f Dockerfile -t {{.PKG}}:local ../.. --build-arg PACKAGE_DIR=services/product-narrative

  docker:push:
    desc: Push this package's image (tag comes from package.json version)
    deps: [docker:build]
    cmds:
      - sh -c 'V=$(node -p "require(\"./package.json\").version"); docker tag {{.PKG}}:local $REGISTRY/product-narrative:$V && docker push $REGISTRY/product-narrative:$V'
